name: Release

# Publishes to npm. The first release of a brand-new package cannot use npm
# trusted publishing (OIDC): a trusted publisher can only be configured on a
# package that already exists, so the bootstrap publish needs a token.
#
#   Repository secret NPM_TOKEN — an npm "Automation" (or granular read+write)
#   token for the package owner. Optional afterwards: once the package exists,
#   configure the trusted publisher for this repo + workflow and OIDC takes
#   over — no secret, and provenance is signed by npm.
#
# Runs on a v* tag, or manually against a ref.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance, and OIDC once the trusted publisher is configured

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Check the publish tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Check the artifact DSH needs is present
        run: |
          # A published plugin is loaded from lib/; the browser half is copied
          # there by scripts/copy-client.mjs. A missing entry point would install
          # cleanly and then fail to activate, so refuse to publish one.
          for f in lib/index.js lib/client.js cordis.patch.yml; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Require the bootstrap token
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set. Add it under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
